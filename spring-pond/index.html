<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春池 · Spring Pond</title>
<style>
  :root {
    --bg: #0a0f14;
    --panel-bg: #0d1318;
    --card: #141c24;
    --border: #1e2a36;
    --text: #c8d4de;
    --text-dim: #5a6e7f;
    --accent: #4ecdc4;
    --accent-dim: rgba(78,205,196,.15);
    --radius: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    display: flex;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 300px; min-width: 300px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    padding: 24px 20px 32px;
    display: flex; flex-direction: column;
    gap: 4px; overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .brand h1 {
    font-size: 22px; font-weight: 700; letter-spacing: 4px;
    color: var(--accent); line-height: 1.2;
  }
  .brand .sub {
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim); margin-top: 3px;
  }
  .brand .desc {
    font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.6;
  }

  .section-title {
    font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--text-dim);
    margin: 18px 0 10px; padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .upload-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px 16px;
    background: var(--accent); color: #062825;
    border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .upload-btn:hover { opacity: .88; }
  .upload-btn:active { transform: scale(.98); }
  .upload-btn.secondary {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); font-weight: 500;
    margin-top: 8px;
  }
  .upload-btn.secondary:hover { border-color: var(--text-dim); }
  input[type="file"] { display: none; }

  .ctrl-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .ctrl-row label {
    flex: 0 0 68px; font-size: 12.5px; color: var(--text);
  }
  .ctrl-row input[type="range"] {
    flex: 1; height: 4px; -webkit-appearance: none;
    appearance: none; background: var(--border); border-radius: 2px;
    outline: none; cursor: pointer;
  }
  .ctrl-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px;
    border-radius: 50%; background: var(--accent);
    border: 3px solid var(--panel-bg);
    cursor: pointer; transition: transform .15s;
  }
  .ctrl-row input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }
  .ctrl-row .val {
    flex: 0 0 34px; text-align: right; font-size: 11.5px;
    font-variant-numeric: tabular-nums; color: var(--text-dim);
  }

  .toggle-group { display: flex; gap: 6px; margin: 6px 0 2px; }
  .toggle-btn {
    flex: 1; padding: 9px 8px; border-radius: var(--radius);
    border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); font-size: 12.5px; cursor: pointer;
    transition: all .2s;
  }
  .toggle-btn.active {
    background: var(--accent); color: #062825;
    border-color: var(--accent); font-weight: 600;
  }
  .toggle-btn:not(.active):hover { border-color: var(--text-dim); color: var(--text); }

  .color-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .color-row label { flex: 1; font-size: 12.5px; }
  .color-swatch {
    width: 30px; height: 30px; border-radius: 6px;
    border: 2px solid var(--border); cursor: pointer;
    position: relative; overflow: hidden;
  }
  .color-swatch input[type="color"] {
    position: absolute; inset: -6px; width: 44px; height: 44px;
    cursor: pointer; border: none; padding: 0; background: none;
  }

  .hint {
    font-size: 11px; color: var(--text-dim); line-height: 1.6;
    margin-top: 14px; padding: 10px 12px;
    background: var(--card); border-radius: var(--radius);
  }
  .hint b { color: var(--accent); font-weight: 600; }

  /* ── Canvas ── */
  .canvas-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #05080b; position: relative; overflow: hidden;
  }
  #pond {
    max-width: 100%; max-height: 100%;
    cursor: crosshair; display: block;
  }
  .drop-overlay {
    position: absolute; inset: 12px; border: 2px dashed var(--accent);
    border-radius: 16px; display: none; align-items: center; justify-content: center;
    background: rgba(78,205,196,.06); backdrop-filter: blur(2px);
    color: var(--accent); font-size: 16px; font-weight: 600;
    pointer-events: none; z-index: 20;
  }
  .drop-overlay.show { display: flex; }

  .status-bar {
    position: absolute; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 18px; align-items: center;
    background: rgba(5,10,14,.6); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 8px 18px; border-radius: 20px;
    font-size: 11.5px; color: rgba(200,215,225,.65);
    z-index: 10; pointer-events: none;
    border: 1px solid rgba(255,255,255,.05);
  }
  .status-bar .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    display: inline-block; margin-right: 5px; vertical-align: 1px;
  }
  .status-bar b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; min-width: 0; max-height: 45vh; order: 2; border-right: none; border-top: 1px solid var(--border); }
    .canvas-area { order: 1; min-height: 55vh; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <h1>春 池</h1>
    <div class="sub">Spring Pond · 水纹生成器</div>
    <div class="desc">上传一张图片，让它沉入春水池底。雨点落下，波纹荡开，光影折射流转。</div>
  </div>

  <div class="section-title">图片</div>
  <button class="upload-btn" id="uploadBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    上传图片
  </button>
  <button class="upload-btn secondary" id="demoBtn">使用示例图片</button>
  <input type="file" id="fileInput" accept="image/*">

  <div class="section-title">降雨</div>
  <div class="toggle-group">
    <button class="toggle-btn active" id="rainOn">自动降雨</button>
    <button class="toggle-btn" id="rainOff">雨停了</button>
  </div>
  <div class="ctrl-row">
    <label>降雨频率</label>
    <input type="range" id="rainRate" min="1" max="60" value="18">
    <span class="val" id="rainRateV">18</span>
  </div>
  <div class="ctrl-row">
    <label>雨滴大小</label>
    <input type="range" id="dropSize" min="1" max="10" value="3">
    <span class="val" id="dropSizeV">3</span>
  </div>
  <div class="ctrl-row">
    <label>雨点力度</label>
    <input type="range" id="dropForce" min="10" max="200" value="90">
    <span class="val" id="dropForceV">90</span>
  </div>

  <div class="section-title">水面</div>
  <div class="ctrl-row">
    <label>波纹存续</label>
    <input type="range" id="damping" min="80" max="99" value="96">
    <span class="val" id="dampingV">96</span>
  </div>
  <div class="ctrl-row">
    <label>折射强度</label>
    <input type="range" id="refract" min="0" max="60" value="24">
    <span class="val" id="refractV">24</span>
  </div>
  <div class="ctrl-row">
    <label>光泽高光</label>
    <input type="range" id="specular" min="0" max="100" value="45">
    <span class="val" id="specularV">45</span>
  </div>
  <div class="color-row">
    <label>水色叠染</label>
    <div class="color-swatch"><input type="color" id="tintColor" value="#1a6b62"></div>
  </div>
  <div class="ctrl-row">
    <label>叠染浓度</label>
    <input type="range" id="tintAmt" min="0" max="60" value="12">
    <span class="val" id="tintAmtV">12</span>
  </div>

  <div class="hint">
    <b>点击 / 拖动</b> 水面可手动激起涟漪。<br>
    也可以直接把图片<b>拖拽</b>到水面上。
  </div>
</aside>

<main class="canvas-area" id="canvasArea">
  <canvas id="pond"></canvas>
  <div class="drop-overlay" id="dropOverlay">松开，让图片沉入春池</div>
  <div class="status-bar">
    <span><span class="dot"></span><b id="fpsV">60</b> FPS</span>
    <span>波纹 <b id="rippleV">0</b></span>
    <span id="sizeV">—</span>
  </div>
</main>

<script>
'use strict';
/* ─────────── 春池 · 水面波纹折射模拟 ───────────
 * 原理：双缓冲高度场波动方程 + 按水面梯度偏移采样底图（折射）
 * next[i] = (left+right+up+down)/2 - prev[i]，再乘以阻尼
 */

const canvas = document.getElementById('pond');
const ctx = canvas.getContext('2d');
const area = document.getElementById('canvasArea');

// ── 状态 ──
const S = {
  rainOn: true,
  rainRate: 18,      // 每秒滴数
  dropSize: 3,       // 半径（模拟网格单位）
  dropForce: 90,     // 扰动强度
  damping: 0.96,
  refract: 24,       // 折射像素偏移强度
  specular: 45,      // 高光强度 0-100
  tint: [26, 107, 98],
  tintAmt: 0.12,
};

// ── 模拟网格（低分辨率以保证性能，渲染时放大） ──
const SIM_SCALE = 2;   // 每个模拟格对应的画布像素
let W = 0, H = 0;       // 模拟网格尺寸
let CW = 0, CH = 0;     // 画布尺寸
let buf1, buf2;         // Float32 高度场
let srcData = null;     // 底图像素 (ImageData.data)
let outImage = null;    // 输出 ImageData
let img = null;         // 当前底图 Image
let rippleCount = 0;

function setupCanvas(image) {
  img = image;
  // 适配可用区域
  const maxW = area.clientWidth - 24;
  const maxH = area.clientHeight - 24;
  let cw = image.width, ch = image.height;
  const s = Math.min(maxW / cw, maxH / ch, 1);
  cw = Math.round(cw * s); ch = Math.round(ch * s);
  // 保证是 SIM_SCALE 的倍数
  cw -= cw % SIM_SCALE; ch -= ch % SIM_SCALE;

  CW = cw; CH = ch;
  canvas.width = CW; canvas.height = CH;
  W = CW / SIM_SCALE; H = CH / SIM_SCALE;

  buf1 = new Float32Array(W * H);
  buf2 = new Float32Array(W * H);

  // 采样底图
  const off = document.createElement('canvas');
  off.width = CW; off.height = CH;
  const octx = off.getContext('2d');
  octx.drawImage(image, 0, 0, CW, CH);
  srcData = octx.getImageData(0, 0, CW, CH).data;
  outImage = ctx.createImageData(CW, CH);
  // alpha 全部置 255
  const od = outImage.data;
  for (let i = 3; i < od.length; i += 4) od[i] = 255;

  document.getElementById('sizeV').textContent = CW + ' × ' + CH;
  rippleCount = 0;
}

// ── 扰动（雨滴 / 点击） ──
function disturb(gx, gy, radius, force) {
  const r2 = radius * radius;
  const x0 = Math.max(1, gx - radius), x1 = Math.min(W - 2, gx + radius);
  const y0 = Math.max(1, gy - radius), y1 = Math.min(H - 2, gy + radius);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const dx = x - gx, dy = y - gy;
      const d2 = dx * dx + dy * dy;
      if (d2 <= r2) {
        const fall = 1 - Math.sqrt(d2) / (radius + 0.001);
        buf1[y * W + x] -= force * fall;
      }
    }
  }
  rippleCount++;
}

// ── 波动传播 ──
function stepSim() {
  const damp = S.damping;
  for (let y = 1; y < H - 1; y++) {
    const row = y * W;
    for (let x = 1; x < W - 1; x++) {
      const i = row + x;
      let v = (buf1[i - 1] + buf1[i + 1] + buf1[i - W] + buf1[i + W]) * 0.5 - buf2[i];
      buf2[i] = v * damp;
    }
  }
  const t = buf1; buf1 = buf2; buf2 = t;
}

// ── 渲染：按梯度折射采样 ──
function render() {
  const od = outImage.data, sd = srcData;
  const refr = S.refract / 10;           // 梯度→像素偏移系数
  const spec = S.specular * 0.06;        // 高光系数
  const [tr, tg, tb] = S.tint;
  const ta = S.tintAmt, ia = 1 - ta;

  for (let y = 0; y < H; y++) {
    const ry = y * W;
    for (let x = 0; x < W; x++) {
      const i = ry + x;
      // 梯度
      const xl = x > 0 ? buf1[i - 1] : 0, xr = x < W - 1 ? buf1[i + 1] : 0;
      const yu = y > 0 ? buf1[i - W] : 0, yd = y < H - 1 ? buf1[i + W] : 0;
      const gx = (xr - xl), gy = (yd - yu);
      // 折射偏移（画布像素）
      let sx = x * SIM_SCALE + gx * refr;
      let sy = y * SIM_SCALE + gy * refr;
      if (sx < 0) sx = 0; else if (sx > CW - 1) sx = CW - 1;
      if (sy < 0) sy = 0; else if (sy > CH - 1) sy = CH - 1;
      const si = ((sy | 0) * CW + (sx | 0)) * 4;

      // 高光：梯度越陡越亮/暗，模拟光线
      const lum = -gx * spec - gy * spec;

      let r = sd[si] + lum, g = sd[si + 1] + lum, b = sd[si + 2] + lum;
      // 水色叠染
      r = r * ia + tr * ta; g = g * ia + tg * ta; b = b * ia + tb * ta;

      // 写入 SIM_SCALE×SIM_SCALE 块
      const bx = x * SIM_SCALE, by = y * SIM_SCALE;
      for (let dy = 0; dy < SIM_SCALE; dy++) {
        let oi = ((by + dy) * CW + bx) * 4;
        for (let dx = 0; dx < SIM_SCALE; dx++) {
          od[oi] = r; od[oi + 1] = g; od[oi + 2] = b;
          oi += 4;
        }
      }
    }
  }
  ctx.putImageData(outImage, 0, 0);
}

// ── 降雨 ──
let rainAcc = 0;
function rain(dt) {
  if (!S.rainOn || !buf1) return;
  rainAcc += dt * S.rainRate;
  while (rainAcc >= 1) {
    rainAcc -= 1;
    const x = 2 + (Math.random() * (W - 4)) | 0;
    const y = 2 + (Math.random() * (H - 4)) | 0;
    const jitter = 0.6 + Math.random() * 0.8;
    disturb(x, y, Math.max(1, Math.round(S.dropSize * jitter)), S.dropForce * jitter);
  }
}

// ── 主循环 ──
let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsTimer = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (buf1) {
    rain(dt);
    stepSim();
    render();
  }
  // FPS
  fpsAcc += 1 / Math.max(dt, 0.0001); fpsN++; fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    document.getElementById('fpsV').textContent = Math.round(fpsAcc / fpsN);
    document.getElementById('rippleV').textContent = rippleCount;
    fpsAcc = 0; fpsN = 0; fpsTimer = 0;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── 交互：点击 / 拖动 ──
let dragging = false;
function pointerDisturb(e) {
  if (!buf1) return;
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width * W;
  const py = (e.clientY - rect.top) / rect.height * H;
  disturb(px | 0, py | 0, Math.max(2, S.dropSize + 1), S.dropForce * 1.6);
}
canvas.addEventListener('pointerdown', e => { dragging = true; pointerDisturb(e); });
window.addEventListener('pointerup', () => dragging = false);
canvas.addEventListener('pointermove', e => { if (dragging) pointerDisturb(e); });

// ── 上传 ──
const fileInput = document.getElementById('fileInput');
document.getElementById('uploadBtn').onclick = () => fileInput.click();
fileInput.onchange = e => {
  const f = e.target.files[0];
  if (f) loadFile(f);
  fileInput.value = '';
};
function loadFile(f) {
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => { setupCanvas(im); URL.revokeObjectURL(url); };
  im.src = url;
}

// 拖拽上传
const overlay = document.getElementById('dropOverlay');
['dragenter','dragover'].forEach(ev => area.addEventListener(ev, e => {
  e.preventDefault(); overlay.classList.add('show');
}));
['dragleave','drop'].forEach(ev => area.addEventListener(ev, e => {
  e.preventDefault(); if (ev === 'dragleave' && e.target !== area) return;
  overlay.classList.remove('show');
}));
area.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadFile(f);
});

// ── 示例图片：程序化生成一幅"春日锦鲤池"风格图 ──
document.getElementById('demoBtn').onclick = () => {
  const c = document.createElement('canvas');
  c.width = 1000; c.height = 750;
  const g = c.getContext('2d');
  // 池底渐变
  const grad = g.createRadialGradient(500, 300, 80, 500, 400, 700);
  grad.addColorStop(0, '#3d8f7f');
  grad.addColorStop(0.5, '#1e5e56');
  grad.addColorStop(1, '#0d3330');
  g.fillStyle = grad; g.fillRect(0, 0, 1000, 750);
  // 池底石子
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * 1000, y = Math.random() * 750;
    const r = 6 + Math.random() * 22;
    const l = 30 + Math.random() * 45;
    g.fillStyle = `hsl(${160 + Math.random() * 40}, ${12 + Math.random() * 18}%, ${l}%)`;
    g.beginPath(); g.ellipse(x, y, r, r * (0.6 + Math.random() * 0.4), Math.random() * 3.2, 0, 7); g.fill();
  }
  // 锦鲤
  function koi(x, y, ang, scale, hue) {
    g.save(); g.translate(x, y); g.rotate(ang); g.scale(scale, scale);
    g.fillStyle = hue;
    g.beginPath(); g.ellipse(0, 0, 46, 17, 0, 0, 7); g.fill();
    g.beginPath(); g.moveTo(-42, 0); g.quadraticCurveTo(-70, -16, -62, 0); g.quadraticCurveTo(-70, 16, -42, 0); g.fill();
    g.fillStyle = 'rgba(230,90,50,.85)';
    g.beginPath(); g.ellipse(8, -4, 12, 8, 0.4, 0, 7); g.fill();
    g.beginPath(); g.ellipse(-16, 5, 9, 6, -0.3, 0, 7); g.fill();
    g.restore();
  }
  koi(280, 520, -0.6, 1.15, '#f2ede4');
  koi(680, 230, 2.3, 0.95, '#f5f0e8');
  koi(560, 560, 0.9, 0.8, '#e8e2d5');
  // 睡莲叶
  for (const [x, y, r] of [[130, 130, 68], [850, 600, 85], [820, 110, 52], [90, 640, 58]]) {
    g.fillStyle = 'rgba(48,110,74,.92)';
    g.beginPath(); g.arc(x, y, r, 0.25, 6.1); g.lineTo(x, y); g.fill();
    g.strokeStyle = 'rgba(30,80,52,.6)'; g.lineWidth = 2;
    for (let a = 0.6; a < 6; a += 0.9) {
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r * 0.9, y + Math.sin(a) * r * 0.9); g.stroke();
    }
  }
  // 花
  g.fillStyle = '#f2b6c6';
  for (let a = 0; a < 6.28; a += 0.785) {
    g.beginPath(); g.ellipse(850 + Math.cos(a) * 16, 600 + Math.sin(a) * 16, 13, 6, a, 0, 7); g.fill();
  }
  g.fillStyle = '#f7d84b'; g.beginPath(); g.arc(850, 600, 7, 0, 7); g.fill();

  const im = new Image();
  im.onload = () => setupCanvas(im);
  im.src = c.toDataURL();
};

// ── 控件绑定 ──
function bindSlider(id, cb) {
  const el = document.getElementById(id), v = document.getElementById(id + 'V');
  el.addEventListener('input', () => { v.textContent = el.value; cb(+el.value); });
}
bindSlider('rainRate', x => S.rainRate = x);
bindSlider('dropSize', x => S.dropSize = x);
bindSlider('dropForce', x => S.dropForce = x);
bindSlider('damping', x => S.damping = x / 100);
bindSlider('refract', x => S.refract = x);
bindSlider('specular', x => S.specular = x);
bindSlider('tintAmt', x => S.tintAmt = x / 100);

const rainOnBtn = document.getElementById('rainOn');
const rainOffBtn = document.getElementById('rainOff');
rainOnBtn.onclick = () => { S.rainOn = true; rainOnBtn.classList.add('active'); rainOffBtn.classList.remove('active'); };
rainOffBtn.onclick = () => { S.rainOn = false; rainOffBtn.classList.add('active'); rainOnBtn.classList.remove('active'); };

document.getElementById('tintColor').addEventListener('input', e => {
  const h = e.target.value;
  S.tint = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
});

// 窗口调整时重建
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (img) setupCanvas(img); }, 250);
});

// 启动即加载示例
document.getElementById('demoBtn').click();
</script>
</body>
</html>
